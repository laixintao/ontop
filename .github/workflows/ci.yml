name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install script and workflow linters
        run: brew install shellcheck actionlint
      - name: Lint
        run: |
          shellcheck scripts/*.sh
          actionlint

  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test and package
        run: ./scripts/ci.sh
      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OnTop-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload preview snapshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preview-snapshots-${{ matrix.runner }}
          path: build/qa/*.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: OnTop-macos-15
          path: dist
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create draft with verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "OnTop $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md \
            dist/*.dmg dist/*.zip dist/SHA256SUMS
